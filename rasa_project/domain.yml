version: "3.1"

intents:
  - exam_timetable
  - course_registration
  - fee_payment
  - hostel_application
  - library_service
  - it_support
  - class_timetable
  - student_id_card
  - scholarship_financial_aid
  - transcript_request
  - counseling_service
  - parking_permit
  - greeting
  - out_of_scope

responses:
  utter_exam_timetable:
    - text: "You can check your exam timetable from the student portal under Examination > Timetable."
  utter_course_registration:
    - text: "Use the student portal Course Registration page to add/drop subjects during the active registration window."
  utter_fee_payment:
    - text: "Tuition and semester fees can be paid through the Finance/Payment section in the portal."
  utter_hostel_application:
    - text: "Hostel applications are submitted through the Accommodation module in the student portal."
  utter_library_service:
    - text: "Library services are available at the library portal for borrowing, renewal, and online resources."
  utter_it_support:
    - text: "For IT issues, contact campus IT support or use the portal helpdesk ticket form."
  utter_class_timetable:
    - text: "Your weekly class timetable is available in the student portal under Academic > Class Timetable."
  utter_student_id_card:
    - text: "New or replacement student ID cards are issued at the Student Affairs counter."
  utter_scholarship_financial_aid:
    - text: "Scholarship and financial aid applications are submitted through the student portal under Financial Aid."
  utter_transcript_request:
    - text: "Official transcripts can be requested through the student portal under Academic > Transcript Request."
  utter_counseling_service:
    - text: "You can book a counseling appointment through the Student Counseling Center via the student portal."
  utter_parking_permit:
    - text: "Campus parking permits are applied for through the student portal under Facilities > Parking Permit."
  utter_greeting:
    - text: "Hello! I'm the Campus FAQ Assistant. Ask me about exams, fees, hostel, library, IT support, and more."
  utter_out_of_scope:
    - text: "Sorry, I am not sure about that yet. Please contact the admin office for help."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
